name: A204

# Profiles are groups of data you can easily switch between. A common usage is
# to define profiles for various environments of a REST service
profiles:
  local:
    data:
      host: http://localhost:9797
  soul-matrix:
    data:
      host: http://192.168.1.1:9797

requests:
  index:
    name: index
    method: GET
    url: "{{ host }}"

  download:
    method: POST
    url: "{{ host }}/download"
    body:
      type: json
      data: { "url": "", "devices": ["Xteink X4"] }

  device:
    method: GET
    url: "{{ host }}/devices"

  meta:
    method: GET
    url: "{{ host }}/meta"
